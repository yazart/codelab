name: Deploy codelab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codelab-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: [self-hosted, Linux, X64, codelab-production]
    timeout-minutes: 20
    env:
      WEB_DEPLOY_DIR: /var/www/codelab/web
      SERVER_DEPLOY_DIR: /var/www/codelab/server
      CODELAB_API_BASE: ${{ vars.CODELAB_API_BASE }}
      CODELAB_WEBSOCKET_URL: ${{ vars.CODELAB_WEBSOCKET_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            codelab-editor/package-lock.json
            codelab-server/package-lock.json

      - name: Install web dependencies
        working-directory: codelab-editor
        run: npm ci --no-audit --no-fund

      - name: Build web application
        working-directory: codelab-editor
        run: npm run build

      - name: Install server dependencies
        working-directory: codelab-server
        run: npm ci --no-audit --no-fund

      - name: Build server
        working-directory: codelab-server
        run: npm run build

      - name: Prepare deployment artifacts
        id: artifacts
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "${RUNNER_TEMP:-}"
          web_stage="$RUNNER_TEMP/codelab-web-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          server_stage="$RUNNER_TEMP/codelab-server-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$web_stage" "$server_stage"

          cp -a codelab-editor/dist/. "$web_stage/"
          cp -a codelab-server/dist "$server_stage/dist"
          cp codelab-server/package.json codelab-server/package-lock.json "$server_stage/"
          cp codelab-server/ecosystem.config.cjs "$server_stage/"

          CODELAB_CONFIG_PATH="$web_stage/assets/config.json" node <<'NODE'
          const fs = require('node:fs');

          const configPath = process.env.CODELAB_CONFIG_PATH;
          const config = {
            webSocketUrl: process.env.CODELAB_WEBSOCKET_URL || '/sync',
            apiBase: process.env.CODELAB_API_BASE || '/api/v1',
          };

          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          NODE

          npm ci \
            --omit=dev \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --prefix "$server_stage"

          echo "web_stage=$web_stage" >> "$GITHUB_OUTPUT"
          echo "server_stage=$server_stage" >> "$GITHUB_OUTPUT"

      - name: Deploy artifacts
        shell: bash
        env:
          WEB_STAGE: ${{ steps.artifacts.outputs.web_stage }}
          SERVER_STAGE: ${{ steps.artifacts.outputs.server_stage }}
        run: |
          set -Eeuo pipefail

          test "$WEB_DEPLOY_DIR" = "/var/www/codelab/web"
          test "$SERVER_DEPLOY_DIR" = "/var/www/codelab/server"
          test -d "$WEB_DEPLOY_DIR"
          test -d "$SERVER_DEPLOY_DIR"
          command -v rsync >/dev/null

          rsync --archive --delete "$WEB_STAGE/" "$WEB_DEPLOY_DIR/"
          rsync \
            --archive \
            --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            "$SERVER_STAGE/" \
            "$SERVER_DEPLOY_DIR/"

      - name: Start or reload server with PM2
        shell: bash
        run: |
          set -Eeuo pipefail

          pm2_cli="$GITHUB_WORKSPACE/codelab-server/node_modules/.bin/pm2"
          test -x "$pm2_cli"

          "$pm2_cli" startOrReload "$SERVER_DEPLOY_DIR/ecosystem.config.cjs" --update-env
          "$pm2_cli" save
          "$pm2_cli" describe codelab-server >/dev/null

      - name: Deployment summary
        run: |
          echo "Web deployed to $WEB_DEPLOY_DIR"
          echo "Server deployed to $SERVER_DEPLOY_DIR"
