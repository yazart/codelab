name: Deploy codelab

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codelab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build deployment artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact_name }}
    env:
      CODELAB_API_BASE: ${{ vars.CODELAB_API_BASE }}
      CODELAB_WEBSOCKET_URL: ${{ vars.CODELAB_WEBSOCKET_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            codelab-editor/package-lock.json
            codelab-server/package-lock.json

      - name: Check deployment rerun validation
        run: node deploy/manifest-validation.test.cjs

      - name: Install web dependencies
        working-directory: codelab-editor
        run: npm ci --no-audit --no-fund

      - name: Build web application
        working-directory: codelab-editor
        run: npm run build

      - name: Install server dependencies
        working-directory: codelab-server
        run: npm ci --no-audit --no-fund

      - name: Build server
        working-directory: codelab-server
        run: npm run build

      - name: Package release and production dependencies
        id: package
        run: bash deploy/package-artifact.sh

      - name: Upload deployment artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.artifact_dir }}/codelab.tar.gz
            ${{ steps.package.outputs.artifact_dir }}/codelab.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  deploy:
    name: Deploy artifact to CodeLab production
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: artifact

      - name: Verify and deploy the prepared release
        shell: bash
        env:
          CODELAB_DEPLOY_KEY: ${{ secrets.CODELAB_DEPLOY_KEY }}
          CODELAB_HOST_KEY: ${{ secrets.CODELAB_HOST_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$CODELAB_DEPLOY_KEY"
          test -n "$CODELAB_HOST_KEY"
          [[ $GITHUB_SHA =~ ^[0-9a-f]{40}$ ]]
          [[ $GITHUB_RUN_ID =~ ^[0-9]+$ && $GITHUB_RUN_ATTEMPT =~ ^[0-9]+$ ]]
          cd artifact
          sha256sum --check codelab.tar.gz.sha256
          artifact_sha256=$(sha256sum codelab.tar.gz | cut -d ' ' -f1)

          umask 077
          key_path="$RUNNER_TEMP/artifact-deploy-key"
          host_keys="$RUNNER_TEMP/codelab-known-hosts"
          trap 'rm -f -- "$key_path" "$host_keys"' EXIT
          printf '%s\n' "$CODELAB_DEPLOY_KEY" > "$key_path"
          printf '%s\n' "$CODELAB_HOST_KEY" > "$host_keys"

          ssh \
            -i "$key_path" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$host_keys" \
            -o ConnectTimeout=15 \
            actions-runner@111.88.127.84 \
            artifact-deploy "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$artifact_sha256" \
            < codelab.tar.gz

