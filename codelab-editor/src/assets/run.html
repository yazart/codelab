<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Console</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    * { box-sizing: border-box; }
    body { min-width: 0; min-height: 100vh; margin: 0; background: #07101e; color: #eaf5ff; font-size: 12px; }
    .console-toolbar { position: sticky; z-index: 2; top: 0; display: flex; min-height: 30px; align-items: center; justify-content: space-between; padding: 0 8px; border-bottom: 1px solid #20416c; background: #0b1a2d; }
    .console-title { color: #9cc9f2; font-size: 11px; }
    .console-clear { border: 0; border-radius: 3px; padding: 3px 7px; background: transparent; color: #9aa0a6; font: inherit; cursor: pointer; }
    .console-clear:hover, .console-clear:focus-visible { outline: 0; background: #17345a; color: #eef6ff; }
    .console-output { min-height: calc(100vh - 30px); }
    .console-row { display: grid; min-height: 24px; grid-template-columns: 22px minmax(0, 1fr); align-items: start; border-bottom: 1px solid #173454; padding: 3px 8px 3px 0; line-height: 18px; }
    .console-row--warn { background: #332b00; color: #fdd663; }
    .console-row--error { background: #3c1717; color: #f28b82; }
    .console-row--info .console-marker { color: #42aaff; }
    .console-marker { text-align: center; color: #9aa0a6; font-weight: 700; user-select: none; }
    .console-values { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .token--string { color: #f28b82; }
    .token--number, .token--boolean { color: #55b4ff; }
    .token--null, .token--undefined, .token--special, .token--symbol { color: #c58af9; }
    .token--function, .token--regexp { color: #d7aefb; font-style: italic; }
    .token--property { color: #80c7ff; }
    .token--muted { color: #80868b; font-style: italic; }
    .token--object-preview { color: #e8eaed; }
    .object-tree { display: inline; }
    .object-tree > summary { display: inline-flex; max-width: 100%; align-items: baseline; cursor: pointer; list-style: none; }
    .object-tree > summary::before { display: inline-block; width: 12px; color: #9aa0a6; content: '▶'; font-size: 8px; transform-origin: 45% 50%; transition: transform .1s; }
    .object-tree[open] > summary::before { transform: rotate(90deg); }
    .object-tree > summary::-webkit-details-marker { display: none; }
    .object-tree > summary:focus-visible { border-radius: 2px; outline: 1px solid #39a7ff; }
    .object-children { margin-left: 6px; padding-left: 13px; border-left: 1px solid #28517e; }
    .object-property { min-height: 18px; color: #bdc1c6; white-space: nowrap; }
    .object-prototype { opacity: .78; }
    .error-value .token--object-preview { color: #f28b82; }
  </style>
</head>
<body>
  <header class="console-toolbar">
    <span class="console-title">Console</span>
    <button class="console-clear" type="button" aria-label="Очистить консоль">Очистить</button>
  </header>
  <main class="console-output" role="list" aria-live="polite"></main>
  <script src="/assets/js/devtools-console.js"></script>
  <script>
    const workerFile = URL.createObjectURL(new Blob([`
      importScripts('${window.location.origin}/assets/js/typescript.js');
      onmessage = ({data: sourceCode}) => postMessage(ts.transpile(sourceCode || ''));
    `], {type: 'text/javascript'}));
    const worker = new Worker(workerFile);
    const pendingRuns = [];

    document.querySelector('.console-clear').addEventListener('click', () => console.clear());

    worker.addEventListener('message', ({data}) => {
      const run = pendingRuns.shift();
      if (!run) return;
      try {
        Function(`"use strict";\n${data}\n//# sourceURL=codelab.ts`)();
      } catch (error) {
        console.error(error);
      }
      console.info('Выполнение завершено');
    });

    worker.addEventListener('error', event => console.error(event.error || event.message));

    window.addEventListener('message', event => {
      if (event.origin !== window.location.origin || typeof event.data !== 'string') return;
      console.info('Выполнение запущено');
      pendingRuns.push(true);
      worker.postMessage(event.data);
    });
  </script>
</body>
</html>
